    resources:
      cpu: "0.25"
      memory: "256Mi"

  - name: currency-service
    version: 1.0.5
    owner: core-ledger@aeropay.io
    environment: production
    status: healthy
    health_url: /health/currency
    ports: [8088]
    dependencies: []
    resources:
      cpu: "0.25"
      memory: "256Mi"

  - name: risk-engine
    version: 2.2.0
