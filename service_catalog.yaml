registry: "aero-registry"
owner: "platform-team@aeropay.io"
version: "1.1"
updated: "2026-09-21"

services:
  - name: auth-svc
    version: 2.4.1
    owner: iam-team@aeropay.io
    environment: production
    status: healthy
    health_url: /health/auth
    ports: [8081]
    dependencies: [ledger-svc]
    resources:
      cpu: "0.5"
      memory: "512Mi"

  - name: ledger-svc
    version: 3.1.0
    owner: core-ledger@aeropay.io
    environment: production
    status: healthy
    health_url: /health/ledger
    ports: [8082]
    dependencies: []
    resources:
      cpu: "1.0"
      memory: "1Gi"

  - name: payment-gateway
    version: 1.9.3
    owner: payments@aeropay.io
    environment: production
    status: healthy
    health_url: /health/payment-gateway
    ports: [8083]
    dependencies: [ledger-svc, fraud-scanner]
    resources:
      cpu: "1.0"
      memory: "1Gi"

  - name: fraud-scanner
    version: 0.7.2
    owner: risk-fraud@aeropay.io
    environment: staging
    status: healthy
    health_url: /health/fraud-scanner
    ports: [8084]
    dependencies: [ledger-svc]
    resources:
      cpu: "0.5"
      memory: "512Mi"

  - name: notification-svc
    version: 2.0.0
    owner: engagement@aeropay.io
    environment: production
    status: unhealthy
    health_url: /health/notification
    ports: [8085]
    dependencies: [payment-gateway]
    resources:
      cpu: "0.25"
      memory: "256Mi"

  - name: kyc-verification
    version: 1.2.0
    owner: compliance@aeropay.io
    environment: production
