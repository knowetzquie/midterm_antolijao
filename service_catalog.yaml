    status: unhealthy
    health_url: /health/risk-engine
    ports: [8089]
    dependencies: [fraud-scanner, ledger-svc]
    resources:
      cpu: "1.0"
      memory: "2Gi"

  - name: api-gateway
    version: 3.5.0
    owner: platform-team@aeropay.io
    environment: production
    status: healthy
    health_url: /health/api-gateway
    ports: [8080]
    dependencies: [auth-svc, payment-gateway]
    resources:
      cpu: "2.0"
      memory: "2Gi"